name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # One job per platform consumers can download the tool for. The linux build
  # also runs the test suite and is what gates the release; the darwin build
  # is allowed to fail so a runner problem on a platform nobody has validated
  # yet cannot hold up a release. Remove continue-on-error once it has run
  # green a few times.
  #
  # darwin_amd64 is not built. It was on macos-13, which GitHub stopped
  # supporting in December 2025: the label gets no runner at all, so the job
  # queued indefinitely and held up a release even though it was allowed to
  # fail. The macos-15-intel label still works and would publish an Intel
  # binary, but only until August 2027, when GitHub-hosted x86_64 macOS ends
  # with the macOS 15 image. Until someone asks, Intel Macs build the tool
  # from source.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runs-on: ubuntu-latest
            gating: true
          - platform: darwin_arm64
            runs-on: macos-latest
            gating: false
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ !matrix.gating }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build everything
        if: matrix.gating
        run: ./pleasew build -p -v notice //... --log_file plz-out/log/build.log

      - name: Run tests
        if: matrix.gating
        run: ./pleasew test -p -v notice --log_file plz-out/log/test.log

      # The tool consumers download: statically linked on linux, so it runs
      # anywhere without matching the builder's libc.
      - name: Build the please_rust binary
        run: ./pleasew build -p -v notice -c opt //tools/please_rust:please_rust

      - name: Stage release assets
        run: |
          mkdir -p release
          cp plz-out/bin/tools/please_rust/please_rust release/please_rust-${{ matrix.platform }}
          chmod +x release/please_rust-${{ matrix.platform }}
          file release/please_rust-${{ matrix.platform }}
          (cd release && shasum -a 256 please_rust-${{ matrix.platform }} > please_rust-${{ matrix.platform }}.sha256)
          cat release/please_rust-${{ matrix.platform }}.sha256

      # The hash pinned in tools/please_rust/BUILD has to match what was
      # published, or consumers cannot verify the download.
      - name: Show hash for the tool pin
        run: |
          echo "PleaseRustTool ${{ matrix.platform }} sha256:"
          cut -d' ' -f1 release/please_rust-${{ matrix.platform }}.sha256

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/

      - name: Archive logs
        if: always() && matrix.gating
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: plz-out/log

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: List what is being published
        run: ls -l assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
