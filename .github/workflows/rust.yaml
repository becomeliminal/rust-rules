name: Rust rules
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build everything
        run: ./pleasew build -p -v notice //... --log_file plz-out/log/build.log
      - name: Run tests
        run: ./pleasew test -p -v notice --log_file plz-out/log/test.log
      # Cross-compilation is verifiable from linux even though running the
      # result is not: the object file says which platform it is for.
      - name: Cross-compile to macOS
        run: |
          ./pleasew build -p -v notice --arch darwin_arm64 //examples/local_crate/package_a:package_a
          rlib=plz-out/gen/darwin_arm64/examples/local_crate/package_a/libpackage_a.rlib
          obj=$(ar t "$rlib" | grep -m1 '\.o$')
          ar x "$rlib" "$obj" && file "$obj"
          file "$obj" | grep -q 'Mach-O 64-bit arm64' || {
            echo "cross-compiled object is not arm64 Mach-O"; exit 1; }

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: plz-out/log

  # The binary consumers actually download, against the build_defs it ships
  # alongside. This repo builds itself with //tools/please_rust:bootstrap, so
  # every other job here runs a tool compiled from the same commit as the
  # rules - which means nothing exercised the pinned release at all.
  #
  # That blind spot shipped a plugin whose build_defs emitted `--dep
  # @declaration` while its own pinned tool predated the qualifier scheme
  # entirely, so first-party deps silently lost their --extern. The pin lags
  # a release by construction (a tag is published, then its hashes are
  # recorded), so nothing stops it lagging a breaking change too. This job is
  # what stops it: if the pinned tool cannot drive these rules, it fails here
  # rather than in somebody's repo.
  pinned-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Enough to exercise generation, first-party deps and a version-
      # disambiguated declaration - which is where a stale tool shows up.
      - name: Test against the pinned release tool
        run: |
          ./pleasew test -p -v notice \
            -o plugin.rust.pleaserusttool://tools/please_rust:please_rust_release \
            //test/firstparty/... //examples/... \
            --log_file plz-out/log/pinned.log
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-tool-logs
          path: plz-out/log

  # macOS is where the platform assumptions show up: five bugs that made a
  # Mac checkout unbuildable were found by building there, one release at a
  # time, and the last two were found by this job. Gating, because a platform
  # nobody develops on daily is exactly the one that needs a build to fail
  # loudly when it breaks.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build everything
        run: ./pleasew build -p -v notice //... --log_file plz-out/log/build.log
      - name: Run tests
        run: ./pleasew test -p -v notice --log_file plz-out/log/test.log
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: plz-out/log
