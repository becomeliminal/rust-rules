name: Rust rules
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build everything
        run: ./pleasew build -p -v notice //... --log_file plz-out/log/build.log
      - name: Run tests
        run: ./pleasew test -p -v notice --log_file plz-out/log/test.log
      # Cross-compilation is verifiable from linux even though running the
      # result is not: the object file says which platform it is for.
      - name: Cross-compile to macOS
        run: |
          ./pleasew build -p -v notice --arch darwin_arm64 //examples/local_crate/package_a:package_a
          rlib=plz-out/gen/darwin_arm64/examples/local_crate/package_a/libpackage_a.rlib
          obj=$(ar t "$rlib" | grep -m1 '\.o$')
          ar x "$rlib" "$obj" && file "$obj"
          file "$obj" | grep -q 'Mach-O 64-bit arm64' || {
            echo "cross-compiled object is not arm64 Mach-O"; exit 1; }
      # Third-party crates are where cross-compilation actually breaks, and
      # until 38ecd95 it did: a build script runs on the host, so its own
      # dependencies must be host-built, and nothing said so. Natively that is
      # invisible because the two triples are the same. These four are chosen
      # for the mechanism they exercise rather than for coverage - two reach a
      # crate only as a build dependency, two only through a proc macro.
      #
      # Not //third_party/crates:all: three binaries and blake3's NEON C
      # cannot cross without a macOS SDK and a cross C toolchain, which is the
      # CCTool gap rather than this one.
      # TargetTriple names a triple verbatim, for the ones Please's os_arch
      # pair cannot express. Set to the host's own triple it must produce
      # exactly what deriving it produces, or it is not an escape hatch, it
      # is a second code path.
      - name: Explicit target triple matches the derived one
        run: |
          ./pleasew query print '//examples/package:_math#link' > /tmp/derived.txt
          ./pleasew query print -o plugin.rust.targettriple:x86_64-unknown-linux-gnu \
            '//examples/package:_math#link' > /tmp/explicit.txt
          test -s /tmp/derived.txt || { echo "query produced nothing"; exit 1; }
          diff /tmp/derived.txt /tmp/explicit.txt
          # And a triple that has no os_arch pair reaches rustc at all.
          ./pleasew query print -o plugin.rust.targettriple:wasm32-unknown-unknown \
            '//examples/package:_math#link' | grep -q -- '--target wasm32-unknown-unknown'

      # wasm32 has no os_arch pair, so it exists only through TargetTriple.
      # Checked by inspecting the emitted object rather than by trusting the
      # flag, the same way the darwin_arm64 step does.
      - name: Compile to wasm32
        run: |
          ./pleasew build -p -v notice \
            -o plugin.rust.targettriple:wasm32-unknown-unknown \
            //examples/package:math
          rlib=plz-out/gen/examples/package/libmath.rlib
          obj=$(ar t "$rlib" | grep -m1 '\.o$')
          ar x "$rlib" "$obj" && file "$obj"
          file "$obj" | grep -q 'WebAssembly' || {
            echo "object is not a WebAssembly module"; exit 1; }

      - name: Cross-compile third-party crates
        run: |
          ./pleasew build -p -v notice --arch darwin_arm64 \
            //third_party/crates:generic_array \
            //third_party/crates:clang_sys \
            //third_party/crates:serde \
            //third_party/crates:thiserror

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: plz-out/log

  # The binary consumers actually download, against the build_defs it ships
  # alongside. This repo builds itself with //tools/please_rust:bootstrap, so
  # every other job here runs a tool compiled from the same commit as the
  # rules - which means nothing exercised the pinned release at all.
  #
  # That blind spot shipped a plugin whose build_defs emitted `--dep
  # @declaration` while its own pinned tool predated the qualifier scheme
  # entirely, so first-party deps silently lost their --extern. The pin lags
  # a release by construction (a tag is published, then its hashes are
  # recorded), so nothing stops it lagging a breaking change too. This job is
  # what stops it: if the pinned tool cannot drive these rules, it fails here
  # rather than in somebody's repo.
  pinned-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Enough to exercise generation, first-party deps and a version-
      # disambiguated declaration - which is where a stale tool shows up.
      - name: Test against the pinned release tool
        run: |
          ./pleasew test -p -v notice \
            -o plugin.rust.pleaserusttool://tools/please_rust:please_rust_release \
            //test/... //examples/... \
            --log_file plz-out/log/pinned.log
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-tool-logs
          path: plz-out/log

  # plz cover ran in no workflow at all, so the llvm-cov and llvm-profdata
  # paths, the LlvmTools config and the profraw pipeline were guarded by
  # nothing - while being exactly what the toolchain restructuring in 0.6.3
  # put at risk. go-rules has a test_coverage job for the same reason.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests with coverage
        run: ./pleasew cover -p -v notice --log_file plz-out/log/cover.log
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: plz-out/log

  # macOS is where the platform assumptions show up: five bugs that made a
  # Mac checkout unbuildable were found by building there, one release at a
  # time, and the last two were found by this job. Gating, because a platform
  # nobody develops on daily is exactly the one that needs a build to fail
  # loudly when it breaks.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build everything
        run: ./pleasew build -p -v notice //... --log_file plz-out/log/build.log
      - name: Run tests
        run: ./pleasew test -p -v notice --log_file plz-out/log/test.log
      # Nothing had ever run the darwin_arm64 binary this repo publishes and
      # pins, so its hash was taken on trust.
      - name: Test against the pinned release tool
        run: |
          ./pleasew test -p -v notice \
            -o plugin.rust.pleaserusttool://tools/please_rust:please_rust_release \
            //test/... //examples/... \
            --log_file plz-out/log/pinned.log
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: plz-out/log
